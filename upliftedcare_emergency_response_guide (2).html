<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpliftedCare - Emergency Preparedness Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (Fixed missing closing script tag) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Custom Scrollbar for smooth touch scroll */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .pulse-red {
            animation: pulse-red-anim 1.8s infinite;
        }
        @keyframes pulse-red-anim {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Emergency Data from Document
        const FACILITIES = {
            main: {
                name: "Main Building",
                address: "482 Main St. NW, Bourbonnais, IL",
                shelter: "Any of the FOUR Restrooms",
                evacuation: "SW Corner of Parking Lot",
                panicButton: "Front Office Lobby Desk (Under Desk)",
                egressAssembly: "Bourbonnais Police Department",
                generator: "Has Natural Gas Generator (Starts in 5s automatically for emergency circuits)"
            },
            grief: {
                name: "Grief Center",
                address: "3115N, 1000W Rd., Bourbonnais, IL",
                shelter: "Room 115 - The Hideaway (Art Room)",
                evacuation: "Garage (North boundary of parking lot)",
                panicButton: "Front Lobby Desk, Outside Administrative Offices",
                egressAssembly: "Gas Station across the street",
                generator: "No Generator. Battery emergency lights only."
            }
        };

        const INCIDENTS = [
            { id: 'active-shooter', title: 'Active Shooter / Violence', icon: 'shield-alert', category: 'High Risk', color: 'bg-red-600', badge: 'CRITICAL' },
            { id: 'fire', title: 'Fire & Evacuation', icon: 'flame', category: 'Immediate', color: 'bg-orange-600', badge: 'RACE/PASS' },
            { id: 'lockdown', title: 'Security Lock Downs', icon: 'lock', category: 'Security', color: 'bg-amber-600', badge: 'Hard/Soft' },
            { id: 'tornado', title: 'Tornado / Derecho', icon: 'wind', category: 'Severe Weather', color: 'bg-sky-600', badge: 'Shelter' },
            { id: 'bomb-threat', title: 'Bomb Threat Log', icon: 'bomb', category: 'Security Tool', color: 'bg-purple-600', badge: 'Interactive' },
            { id: 'suspicious-package', title: 'Suspicious Package', icon: 'package-x', category: 'Security', color: 'bg-indigo-600', badge: 'Hazmat' },
            { id: 'power-outage', title: 'Power Outage', icon: 'zap-off', category: 'Utility', color: 'bg-yellow-600', badge: 'Generator' },
            { id: 'winter-storm', title: 'Winter Storm / Ice', icon: 'snowflake', category: 'Weather', color: 'bg-blue-600', badge: 'Priority' },
            { id: 'cyber', title: 'Cyber / Data Ransom', icon: 'hard-drive', category: 'IT Hygiene', color: 'bg-teal-600', badge: 'Isolate' },
            { id: 'extreme-temp', title: 'Extreme Temps', icon: 'thermometer', category: 'Weather', color: 'bg-red-700', badge: 'Heat/Cold' },
            { id: 'earthquake', title: 'Earthquake', icon: 'activity', category: 'Geological', color: 'bg-stone-600', badge: 'Drop/Cover' },
            { id: 'supply', title: 'Medical Supply / Drug Shortage', icon: 'pill', category: 'Logistics', color: 'bg-emerald-600', badge: 'Stockpile' }
        ];

        function App() {
            const [activeFacility, setActiveFacility] = useState('main');
            const [selectedIncident, setSelectedIncident] = useState(null);
            const [viewMode, setViewMode] = useState('incidents'); // incidents, contacts
            const [codeWordModal, setCodeWordModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            // Re-initialize Lucide icons on view change
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [selectedIncident, viewMode, activeFacility, codeWordModal]);

            const facility = FACILITIES[activeFacility];

            const filteredIncidents = useMemo(() => {
                if (!searchQuery.trim()) return INCIDENTS;
                return INCIDENTS.filter(i => 
                    i.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    i.category.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [searchQuery]);

            return (
                <div className="max-w-md mx-auto w-full bg-slate-900 min-h-screen flex flex-col justify-between relative pb-20 shadow-2xl border-x border-slate-800">
                    
                    {/* TOP EMERGENCY HEADER */}
                    <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800 p-3 shadow-md">
                        <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center space-x-2">
                                <div className="bg-red-600 text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
                                    <i data-lucide="shield-alert" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-base text-white leading-tight">UpliftedCare</h1>
                                    <p className="text-xs text-red-400 font-semibold tracking-wider uppercase">Emergency Preparedness</p>
                                </div>
                            </div>

                            {/* Direct Call 911 Quick Trigger */}
                            <a 
                                href="tel:911" 
                                className="pulse-red bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-lg active:scale-95 transition"
                            >
                                <i data-lucide="phone-call" className="w-4 h-4"></i>
                                CALL 911
                            </a>
                        </div>

                        {/* Location Switcher & Armstrong Code Button */}
                        <div className="mt-3 flex items-center justify-between gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                            <div className="flex text-xs font-medium bg-slate-950 p-0.5 rounded-lg border border-slate-800 flex-1">
                                <button 
                                    onClick={() => setActiveFacility('main')}
                                    className={`flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'main' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Main Bldg
                                </button>
                                <button 
                                    onClick={() => setActiveFacility('grief')}
                                    className={`flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'grief' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Grief Center
                                </button>
                            </div>

                            {/* Code Word Trigger */}
                            <button 
                                onClick={() => setCodeWordModal(true)}
                                className="bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition"
                            >
                                <i data-lucide="user-check" className="w-3.5 h-3.5"></i>
                                Dr. Armstrong
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT CANVAS */}
                    <main className="p-4 flex-1">

                        {/* Quick Location Alert Bar */}
                        <div className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 mb-4 text-xs space-y-1">
                            <div className="flex items-center justify-between text-slate-300 font-medium">
                                <span className="flex items-center gap-1 text-red-400 font-bold">
                                    <i data-lucide="map-pin" className="w-3.5 h-3.5"></i> {facility.name}
                                </span>
                                <span className="text-slate-400 text-[10px] truncate max-w-[150px]">{facility.address}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-[11px] pt-1 border-t border-slate-700/50">
                                <div><span className="text-slate-400">Shelter:</span> <span className="text-slate-200 font-semibold">{facility.shelter}</span></div>
                                <div><span className="text-slate-400">Evac Zone:</span> <span className="text-slate-200 font-semibold">{facility.evacuation}</span></div>
                            </div>
                        </div>

                        {/* VIEW MODE: INCIDENT LIST / GUIDES */}
                        {viewMode === 'incidents' && !selectedIncident && (
                            <div>
                                {/* Search Bar */}
                                <div className="relative mb-4">
                                    <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Search emergency incident or protocol..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition"
                                    />
                                </div>

                                <div className="flex items-center justify-between mb-2">
                                    <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">Emergency Quick Guides</h2>
                                    <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">{filteredIncidents.length} Hazards</span>
                                </div>

                                <div className="grid grid-cols-1 gap-2.5">
                                    {filteredIncidents.map((incident) => (
                                        <button
                                            key={incident.id}
                                            onClick={() => setSelectedIncident(incident.id)}
                                            className="w-full text-left bg-slate-800/90 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-xl p-3 flex items-center justify-between transition active:scale-[0.99] group shadow-sm"
                                        >
                                            <div className="flex items-center space-x-3">
                                                <div className={`${incident.color} p-2.5 rounded-xl text-white shadow-md flex items-center justify-center shrink-0`}>
                                                    <i data-lucide={incident.icon || 'alert-circle'} className="w-5 h-5"></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-sm font-bold text-slate-100 group-hover:text-red-400 transition">{incident.title}</h3>
                                                    <p className="text-[11px] text-slate-400">{incident.category}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">
                                                    {incident.badge}
                                                </span>
                                                <i data-lucide="chevron-right" className="w-4 h-4 text-slate-500 group-hover:text-slate-300"></i>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* DETAILED INCIDENT ACTION MODULES */}
                        {selectedIncident && (
                            <IncidentDetailModule 
                                incidentId={selectedIncident} 
                                facility={facility}
                                onBack={() => setSelectedIncident(null)} 
                            />
                        )}

                        {/* VIEW MODE: DIRECTORY & CONTACTS */}
                        {viewMode === 'contacts' && (
                            <ContactsModule facility={facility} />
                        )}

                    </main>

                    {/* SILENT "DR. ARMSTRONG" CODE WORD MODAL */}
                    {codeWordModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-amber-500/50 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl relative">
                                <button 
                                    onClick={() => setCodeWordModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white p-1"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="flex items-center space-x-3 border-b border-slate-800 pb-3">
                                    <div className="bg-amber-500/20 text-amber-400 p-2.5 rounded-xl border border-amber-500/30">
                                        <i data-lucide="shield-alert" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-white text-base">Dr. Armstrong Protocol</h3>
                                        <p className="text-xs text-amber-400 font-medium">Discreet Threat Distress Code</p>
                                    </div>
                                </div>

                                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                                    <p className="bg-amber-950/40 border border-amber-900/50 text-amber-200 p-2.5 rounded-lg">
                                        <strong>When to use:</strong> Use when trapped in a hostile situation and unable to request police directly without escalating danger.
                                    </p>

                                    <div className="space-y-1">
                                        <span className="font-bold text-slate-200">Verbal Script Example:</span>
                                        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-[11px] text-slate-200 leading-normal select-all">
                                            "Hello. This is [Your Name]. I need you to page <span className="text-amber-400 font-bold underline">Dr. Armstrong</span> immediately. We have had some complications here. Please tell him/her to come to <span className="text-red-400 font-bold">[Your Current Address]</span> as soon as possible. Tell him/her to come right on into the house."
                                        </div>
                                    </div>

                                    <div className="bg-red-950/30 border border-red-900/40 p-2.5 rounded-lg text-red-200 text-[11px]">
                                        <strong>Receiver Action:</strong> Recipient MUST immediately call 911 with address, then notify Agency Leadership. Receiver MUST NOT respond alone.
                                    </div>
                                </div>

                                <div className="pt-2 flex gap-2">
                                    <a 
                                        href="tel:911" 
                                        className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1.5 shadow"
                                    >
                                        <i data-lucide="phone" className="w-4 h-4"></i> Call 911 Directly
                                    </a>
                                    <button 
                                        onClick={() => setCodeWordModal(false)}
                                        className="px-4 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-semibold"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM MOBILE NAVIGATION BAR */}
                    <nav className="fixed bottom-0 max-w-md w-full bg-slate-950/95 backdrop-blur border-t border-slate-800 px-3 py-2 flex justify-around items-center z-40">
                        <button 
                            onClick={() => { setViewMode('incidents'); setSelectedIncident(null); }}
                            className={`flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'incidents' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                            Hazards
                        </button>
                        <button 
                            onClick={() => { setViewMode('contacts'); setSelectedIncident(null); }}
                            className={`flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'contacts' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i data-lucide="phone" className="w-5 h-5"></i>
                            Contacts
                        </button>
                    </nav>

                </div>
            );
        }

        // --- SUB-COMPONENT: DETAILED INCIDENT ACTIONS ---
        function IncidentDetailModule({ incidentId, facility, onBack }) {
            const renderContent = () => {
                switch (incidentId) {
                    case 'active-shooter':
                        return (
                            <div className="space-y-4">
                                <div className="bg-red-950/50 border border-red-800 p-3 rounded-xl text-xs space-y-2">
                                    <div className="flex items-center gap-2 text-red-400 font-bold text-sm">
                                        <i data-lucide="alert-octagon" className="w-5 h-5"></i> Panic Alarm Locations
                                    </div>
                                    <p className="text-slate-300"><strong>Current Facility ({facility.name}):</strong> {facility.panicButton}</p>
                                    <p className="text-slate-400 text-[11px]">Personal discrete panic buttons also issued for high-risk field visits.</p>
                                </div>

                                <div className="space-y-3">
                                    <h4 className="text-xs font-bold uppercase text-slate-400 tracking-wider">Immediate Actions: Run / Hide / Fight</h4>
                                    
                                    <div className="bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700">
                                        <div className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                                            <span className="w-5 h-5 rounded-full bg-emerald-500/20 flex items-center justify-center text-[10px]">1</span>
                                            A. EVACUATE (RUN)
                                        </div>
                                        <ul className="text-xs text-slate-300 space-y-1 pl-6 list-disc">
                                            <li>Have escape route in mind. Warn others not to enter.</li>
                                            <li>Evacuate regardless of whether others follow. Leave belongings.</li>
                                            <li>Keep hands visible, fingers spread. Follow police orders.</li>
                                            <li>Call 911 when safe. Do not attempt to move wounded.</li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700">
                                        <div className="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                                            <span className="w-5 h-5 rounded-full bg-amber-500/20 flex items-center justify-center text-[10px]">2</span>
                                            B. HIDE OUT (HIDE)
                                        </div>
                                        <ul className="text-xs text-slate-300 space-y-1 pl-6 list-disc">
                                            <li>Hide out of shooter view in locked room/office.</li>
                                            <li>Blockade door with heavy furniture. Move from windows.</li>
                                            <li><strong>SILENCE CELL PHONES</strong> (Turn off vibration mode completely).</li>
                                            <li>Choose cover (protects from bullets) over mere concealment.</li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700">
                                        <div className="text-xs font-bold text-red-400 flex items-center gap-1.5">
                                            <span className="w-5 h-5 rounded-full bg-red-500/20 flex items-center justify-center text-[10px]">3</span>
                                            C. TAKE ACTION (FIGHT - Absolute Last Resort)
                                        </div>
                                        <ul className="text-xs text-slate-300 space-y-1 pl-6 list-disc">
                                            <li>Act as aggressively as possible. Throw items, improvise weapons.</li>
                                            <li>Yell and fully commit to incapacitating the shooter.</li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1 text-xs text-slate-300">
                                    <strong className="text-slate-100">Emergency Egress Gathering Location:</strong>
                                    <p className="text-amber-400 font-semibold">{facility.egressAssembly}</p>
                                    <p className="text-[11px] text-slate-400 mt-1">Incident Command MUST evacuate immediately to gathering location, call law enforcement, and conduct attendance headcount.</p>
                                </div>
                            </div>
                        );

                    case 'fire':
                        return (
                            <div className="space-y-4">
                                <div className="bg-orange-950/40 border border-orange-800 p-3 rounded-xl text-xs space-y-1">
                                    <span className="text-orange-400 font-bold block">Fire Alarm Signals:</span>
                                    <p className="text-slate-200 font-medium">Continuous Audible Buzz + Flashing White Strobe Light</p>
                                    <span className="text-slate-400 text-[11px] block mt-1">Assembly Point: <strong>{facility.evacuation}</strong></span>
                                </div>

                                <div className="bg-slate-800 p-3.5 rounded-xl border border-slate-700 space-y-2">
                                    <h4 className="text-xs font-bold uppercase text-orange-400 tracking-wider">R.A.C.E. Protocol</h4>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>R</strong>escue anyone in danger</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>A</strong>larm: Pull box & Call 911</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>C</strong>ontain: Close doors behind you</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>E</strong>vacuate to designated zone</div>
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-3.5 rounded-xl border border-slate-700 space-y-2">
                                    <h4 className="text-xs font-bold uppercase text-amber-400 tracking-wider">P.A.S.S. Extinguisher Guide</h4>
                                    <p className="text-[11px] text-slate-300">Only attempt to extinguish small contained fires if properly trained and safe escape is clear.</p>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>P</strong>ull safety pin</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>A</strong>im at base of fire</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>S</strong>queeze lever slowly</div>
                                        <div className="bg-slate-900 p-2 rounded border border-slate-700"><strong>S</strong>weep side-to-side</div>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300">
                                    <strong className="text-slate-100">Front Office Duty:</strong> Front Office staff must grab the <em>Guest Sign-In Book</em> during evacuation. Team leaders report headcount to Incident Commander.
                                </div>
                            </div>
                        );

                    case 'lockdown':
                        return (
                            <div className="space-y-3">
                                <div className="bg-amber-950/40 border border-amber-800 p-3 rounded-xl text-xs space-y-2">
                                    <h4 className="font-bold text-amber-400 text-sm">SOFT LOCK DOWN (Exterior Threat)</h4>
                                    <p className="text-slate-300">Initiated for active exterior threat in service area (e.g. violent individual in vicinity).</p>
                                    <ul className="list-disc pl-5 space-y-1 text-slate-300">
                                        <li>Overhead Soft Lockdown notification given.</li>
                                        <li>All external doors secured and locked immediately.</li>
                                        <li>Public & employee entrances strictly monitored.</li>
                                    </ul>
                                </div>

                                <div className="bg-red-950/50 border border-red-800 p-3 rounded-xl text-xs space-y-2">
                                    <h4 className="font-bold text-red-400 text-sm">HARD LOCK DOWN (Imminent Entry Threat)</h4>
                                    <p className="text-slate-300">Initiated when entry/exit must cease immediately (e.g. active shooter exterior/interior).</p>
                                    <ul className="list-disc pl-5 space-y-1 text-slate-300">
                                        <li>Incident Commander calls 911 immediately.</li>
                                        <li>Fob doors remotely deactivated & locked.</li>
                                        <li>Evacuate to internal windowless rooms, lock & barricade doors.</li>
                                        <li>Remain barricaded until official overhead <strong>"ALL CLEAR"</strong> is announced.</li>
                                    </ul>
                                </div>
                            </div>
                        );

                    case 'tornado':
                        return (
                            <div className="space-y-3 text-xs">
                                <div className="bg-sky-950/40 border border-sky-800 p-3 rounded-xl space-y-1">
                                    <span className="font-bold text-sky-400 block text-sm">Designated Facility Shelter Zone:</span>
                                    <p className="text-slate-100 font-semibold">{facility.shelter}</p>
                                </div>

                                <div className="bg-slate-800 p-3.5 rounded-xl border border-slate-700 space-y-2">
                                    <h4 className="font-bold text-slate-200">Field / General Staff Actions</h4>
