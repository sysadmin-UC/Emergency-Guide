<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpliftedCare - Emergency Preparedness Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (Fixed missing closing script tag) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Custom Scrollbar for smooth touch scroll */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .pulse-red {
            animation: pulse-red-anim 1.8s infinite;
        }
        @keyframes pulse-red-anim {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Emergency Data from Document
        const FACILITIES = {
            main: {
                id: "main",
                name: "Main Building",
                address: "482 Main St. NW, Bourbonnais, IL",
                shelter: "Any of the FOUR Restrooms",
                evacuation: "SW Corner of Parking Lot",
                panicButton: "Front Office Lobby Desk (Under Desk)",
                egressAssembly: "Bourbonnais Police Department",
                generator: "Has Natural Gas Generator (Starts in 5s automatically for emergency circuits)"
            },
            grief: {
                id: "grief",
                name: "Grief Center",
                address: "3115N, 1000W Rd., Bourbonnais, IL",
                shelter: "Room 115 - The Hideaway (Art Room)",
                evacuation: "Garage (North boundary of parking lot)",
                panicButton: "Front Lobby Desk, Outside Administrative Offices",
                egressAssembly: "Gas Station across the street",
                generator: "No Generator. Battery emergency lights only."
            }
        };

        const INCIDENTS = [
            { id: 'active-shooter', title: 'Active Shooter / Violence', icon: 'shield-alert', category: 'High Risk', color: 'bg-red-600', badge: 'CRITICAL' },
            { id: 'fire', title: 'Fire & Evacuation', icon: 'flame', category: 'Immediate', color: 'bg-orange-600', badge: 'RACE/PASS' },
            { id: 'lockdown', title: 'Security Lock Downs', icon: 'lock', category: 'Security', color: 'bg-amber-600', badge: 'Hard/Soft' },
            { id: 'tornado', title: 'Tornado / Derecho', icon: 'wind', category: 'Severe Weather', color: 'bg-sky-600', badge: 'Shelter' },
            { id: 'bomb-threat', title: 'Bomb Threat Log', icon: 'bomb', category: 'Security Tool', color: 'bg-purple-600', badge: 'Interactive' },
            { id: 'suspicious-package', title: 'Suspicious Package', icon: 'package-x', category: 'Security', color: 'bg-indigo-600', badge: 'Hazmat' },
            { id: 'power-outage', title: 'Power Outage', icon: 'zap-off', category: 'Utility', color: 'bg-yellow-600', badge: 'Generator' },
            { id: 'winter-storm', title: 'Winter Storm / Ice', icon: 'snowflake', category: 'Weather', color: 'bg-blue-600', badge: 'Priority' },
            { id: 'cyber', title: 'Cyber / Data Ransom', icon: 'hard-drive', category: 'IT Hygiene', color: 'bg-teal-600', badge: 'Isolate' },
            { id: 'extreme-temp', title: 'Extreme Temps', icon: 'thermometer', category: 'Weather', color: 'bg-red-700', badge: 'Heat/Cold' },
            { id: 'earthquake', title: 'Earthquake', icon: 'activity', category: 'Geological', color: 'bg-stone-600', badge: 'Drop/Cover' },
            { id: 'supply', title: 'Medical Supply / Drug Shortage', icon: 'pill', category: 'Logistics', color: 'bg-emerald-600', badge: 'Stockpile' }
        ];

        const HOW_TO_TASKS = [
            {
                id: 'change-tire',
                title: 'Changing a Car Tire',
                category: 'Auto Maintenance',
                icon: 'disc',
                color: 'bg-amber-600',
                badge: 'Tire & Jack',
                summary: 'Step-by-step visual infographic guide on safely lifting your car and changing a flat tire.',
                caution: 'BEFORE PROCEEDING MAKE SURE YOUR EMERGENCY BRAKE IS ON AND THAT CAR IS ON LEVELED GROUND.',
                tools: ['Car Jack', 'Tire Iron', 'Spare Tire & Tools (kept in trunk under carpet)'],
                steps: [
                    '1. Loosening Wheel Bolts: First loosen the wheel bolts with the tire iron by turning counter-clockwise. Do not remove bolts completely.',
                    '2. Raising Car: Insert the carjack underneath the carjack point making sure it lines up with groove from jack. Insert jack lever and raise car by turning lever clockwise.',
                    '3. Removing Tire: Once car tire is lifted off the ground, continue to unbolt the nuts the rest of the way and pull off tire. Pull towards yourself.',
                    '4. Replacing Tire: Put replacement tire on the car and secure with bolts. Screw bolts on with tire iron to hold tire in place.',
                    '5. Lowering Car: Lower car by turning jack lever counter clockwise until jack is fully closed and car is on the ground.',
                    '6. Tightening Wheel Bolts: Tighten wheel bolts by turning tire iron clockwise. Tighten one bolt at a time by alternating from one to the other in a "X" direction.'
                ]
            },
            {
                id: 'jump-start',
                title: 'Jump Starting a Car',
                category: 'Auto Maintenance',
                icon: 'zap',
                color: 'bg-emerald-600',
                badge: 'Battery & Cables',
                summary: 'Standard jumper cable connection procedure and safety guidelines for dead batteries.',
                caution: 'NEVER TOUCH THE CLAMPS TOGETHER WHILE ATTACHED TO EITHER BATTERY. POSSIBLE ELECTROCUTION AND DAMAGE TO THE CARS IS HIGHLY LIKELY.',
                tools: ['Jumper Cables (Set of Red + and Black - Clamps)', 'Donor (Live) Car'],
                steps: [
                    '1. Park the LIVE car close enough to the DEAD car for cables to reach between batteries. Turn off both cars. Open and secure hoods on both cars.',
                    '2. Connect one of the Positive + (RED) cables (SET 1) to the DEAD battery.',
                    '3. Connect the other Positive + (RED) cable (SET 2) to the LIVE battery.',
                    '4. Connect the Negative - (BLACK) cable (SET 2) to the LIVE battery.',
                    '5. Connect the Negative - (BLACK) cable (SET 1) to an unpainted metal surface of the DEAD car.',
                    '6. Start the LIVE car and wait 5 minutes.',
                    '7. Attempt to start the DEAD car. If dead car does not start, allow LIVE car to continue idling for another 5 minutes to charge DEAD battery. Attempt to start DEAD car again.',
                    '8. Once DEAD car is started, remove RED cables from both cars.',
                    '9. Remove BLACK cables from both cars.',
                    '10. Close and secure your car hood and store your cables for later use.'
                ]
            },
            {
                id: 'accident-scene',
                title: 'Safely Setting Up an Accident Scene',
                category: 'Roadside Safety',
                icon: 'alert-triangle',
                color: 'bg-red-600',
                badge: 'Safety Zone',
                summary: 'Establishing extended safety perimeters with LED flares, triangles, and roadside precautions.',
                caution: 'Do not wait in your vehicle if it is close to moving traffic. Wait further off the road to avoid injury from collisions.',
                tools: ['LED Flares / Reflective Safety Triangles', 'Hazard Lights', 'Emergency Phone'],
                steps: [
                    '1. Pull your car over to side of road as far away from traffic as possible.',
                    '2. Turn your wheel to prevent rolling and set the emergency brake.',
                    '3. Activate Hazard Lights in vehicle.',
                    '4. Check oncoming traffic before exiting vehicle. Call for help or assistance if necessary.',
                    '5. Set up LED Flares or safety triangles. Walk along shoulder of road (Not in roadway) - ALWAYS pay attention to oncoming traffic.',
                    '6. Flares should make a slight arc pattern when placed. When safe, place 1st flare along edge of vehicle closest to traffic about 15 ft behind vehicle, return to shoulder.',
                    '7. When safe, place 2nd flare 20-30 ft behind 1st flare, then return to shoulder of road.',
                    '8. When safe, place 3rd flare 20-30 ft behind 2nd flare, then return to shoulder of road.',
                    '9. Return to vehicle by walking along shoulder of road or stand clear of auto and scene while waiting for assistance.',
                    '10. If performing repairs yourself, have another person keep watch for moving traffic while your attention is engaged (or remain very aware if alone).',
                    '11. During daylight hours, use reflective safety triangles to set your Safety Zone Perimeter. Deploy flares as dusk falls or on cloudy days.',
                    '12. If broken down alone or in dangerous area, wait inside car with doors locked. Be VERY cautious if approached by strangers; do not accept rides from strangers.'
                ]
            }
        ];

        function App() {
            const [activeFacility, setActiveFacility] = useState('main');
            const [selectedIncident, setSelectedIncident] = useState(null);
            const [selectedHowTo, setSelectedHowTo] = useState(null);
            const [viewMode, setViewMode] = useState('incidents'); // incidents, contacts, howto
            const [codeWordModal, setCodeWordModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            // Re-initialize Lucide icons on view change
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [selectedIncident, selectedHowTo, viewMode, activeFacility, codeWordModal]);

            const facility = FACILITIES[activeFacility];

            const filteredIncidents = useMemo(() => {
                if (!searchQuery.trim()) return INCIDENTS;
                return INCIDENTS.filter(i => 
                    i.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    i.category.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [searchQuery]);

            return (
                <div className="max-w-md mx-auto w-full bg-slate-900 min-h-screen flex flex-col justify-between relative pb-20 shadow-2xl border-x border-slate-800">
                    
                    {/* TOP EMERGENCY HEADER */}
                    <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800 p-3 shadow-md">
                        <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center space-x-2">
                                <div className="bg-red-600 text-white p-2 rounded-xl shadow-lg flex items-center justify-center">
                                    <i data-lucide="shield-alert" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-base text-white leading-tight">UpliftedCare</h1>
                                    <p className="text-xs text-red-400 font-semibold tracking-wider uppercase">Emergency Preparedness</p>
                                </div>
                            </div>

                            {/* Direct Call 911 Quick Trigger */}
                            <a 
                                href="tel:911" 
                                className="pulse-red bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-lg active:scale-95 transition"
                            >
                                <i data-lucide="phone-call" className="w-4 h-4"></i>
                                CALL 911
                            </a>
                        </div>

                        {/* Location Switcher & Armstrong Code Button */}
                        <div className="mt-3 flex items-center justify-between gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                            <div className="flex text-xs font-medium bg-slate-950 p-0.5 rounded-lg border border-slate-800 flex-1">
                                <button 
                                    onClick={() => setActiveFacility('main')}
                                    className={`flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'main' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Main Bldg
                                </button>
                                <button 
                                    onClick={() => setActiveFacility('grief')}
                                    className={`flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'grief' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Grief Center
                                </button>
                            </div>

                            {/* Code Word Trigger */}
                            <button 
                                onClick={() => setCodeWordModal(true)}
                                className="bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition"
                            >
                                <i data-lucide="user-check" className="w-3.5 h-3.5"></i>
                                Dr. Armstrong
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT CANVAS */}
                    <main className="p-4 flex-1">

                        {/* VIEW MODE: INCIDENT LIST / GUIDES */}
                        {viewMode === 'incidents' && !selectedIncident && (
                            <div>
                                {/* Location Header Bar */}
                                <div className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 mb-4 text-xs">
                                    <div className="flex items-center justify-between text-slate-300 font-medium">
                                        <span className="flex items-center gap-1 text-red-400 font-bold">
                                            <i data-lucide="map-pin" className="w-3.5 h-3.5"></i> Active Location: {facility.name}
                                        </span>
                                        <span className="text-slate-400 text-[10px] truncate max-w-[150px]">{facility.address}</span>
                                    </div>
                                </div>

                                {/* Search Bar */}
                                <div className="relative mb-4">
                                    <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Search emergency incident or protocol..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition"
                                    />
                                </div>

                                <div className="flex items-center justify-between mb-2">
                                    <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">Emergency Quick Guides</h2>
                                    <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">{filteredIncidents.length} Hazards</span>
                                </div>

                                <div className="grid grid-cols-1 gap-2.5">
                                    {filteredIncidents.map((incident) => (
                                        <button
                                            key={incident.id}
                                            onClick={() => setSelectedIncident(incident.id)}
                                            className="w-full text-left bg-slate-800/90 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-xl p-3 flex items-center justify-between transition active:scale-[0.99] group shadow-sm"
                                        >
                                            <div className="flex items-center space-x-3">
                                                <div className={`${incident.color} p-2.5 rounded-xl text-white shadow-md flex items-center justify-center shrink-0`}>
                                                    <i data-lucide={incident.icon || 'alert-circle'} className="w-5 h-5"></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-sm font-bold text-slate-100 group-hover:text-red-400 transition">{incident.title}</h3>
                                                    <p className="text-[11px] text-slate-400">{incident.category}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">
                                                    {incident.badge}
                                                </span>
                                                <i data-lucide="chevron-right" className="w-4 h-4 text-slate-500 group-hover:text-slate-300"></i>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* DETAILED INCIDENT ACTION MODULES */}
                        {selectedIncident && (
                            <IncidentDetailModule 
                                incidentId={selectedIncident} 
                                facility={facility}
                                onBack={() => setSelectedIncident(null)} 
                            />
                        )}

                        {/* VIEW MODE: DIRECTORY & CONTACTS */}
                        {viewMode === 'contacts' && (
                            <ContactsModule facility={facility} />
                        )}

                        {/* VIEW MODE: HOW TO CLINICIAN GUIDES */}
                        {viewMode === 'howto' && !selectedHowTo && (
                            <HowToModule onSelectTask={(task) => setSelectedHowTo(task)} />
                        )}

                        {/* HOW TO DETAILED INFOGRAPHIC VIEW */}
                        {viewMode === 'howto' && selectedHowTo && (
                            <HowToDetailModule task={selectedHowTo} onBack={() => setSelectedHowTo(null)} />
                        )}

                    </main>

                    {/* SILENT "DR. ARMSTRONG" CODE WORD MODAL */}
                    {codeWordModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-amber-500/50 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl relative">
                                <button 
                                    onClick={() => setCodeWordModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white p-1"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="flex items-center space-x-3 border-b border-slate-800 pb-3">
                                    <div className="bg-amber-500/20 text-amber-400 p-2.5 rounded-xl border border-amber-500/30">
                                        <i data-lucide="shield-alert" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-white text-base">Dr. Armstrong Protocol</h3>
                                        <p className="text-xs text-amber-400 font-medium">Discreet Threat Distress Code</p>
                                    </div>
                                </div>

                                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                                    <p className="bg-amber-950/40 border border-amber-900/50 text-amber-200 p-2.5 rounded-lg">
                                        <strong>When to use:</strong> Use when trapped in a hostile situation and unable to request police directly without escalating danger.
                                    </p>

                                    <div className="space-y-1">
                                        <span className="font-bold text-slate-200">Verbal Script Example:</span>
                                        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-[11px] text-slate-200 leading-normal select-all">
                                            "Hello. This is [Your Name]. I need you to page <span className="text-amber-400 font-bold underline">Dr. Armstrong</span> immediately. We have had some complications here. Please tell him/her to come to <span className="text-red-400 font-bold">[Your Current Address]</span> as soon as possible. Tell him/her to come right on into the house."
                                        </div>
                                    </div>

                                    <div className="bg-red-950/30 border border-red-900/40 p-2.5 rounded-lg text-red-200 text-[11px]">
                                        <strong>Receiver Action:</strong> Recipient MUST immediately call 911 with address, then notify Agency Leadership. Receiver MUST NOT respond alone.
                                    </div>
                                </div>

                                <div className="pt-2 flex gap-2">
                                    <a 
                                        href="tel:911" 
                                        className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1.5 shadow"
                                    >
                                        <i data-lucide="phone" className="w-4 h-4"></i> Call 911 Directly
                                    </a>
                                    <button 
                                        onClick={() => setCodeWordModal(false)}
                                        className="px-4 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-semibold"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM MOBILE NAVIGATION BAR */}
                    <nav className="fixed bottom-0 max-w-md w-full bg-slate-950/95 backdrop-blur border-t border-slate-800 px-3 py-2 flex justify-around items-center z-40">
                        <button 
                            onClick={() => { setViewMode('incidents'); setSelectedIncident(null); setSelectedHowTo(null); }}
                            className={`flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'incidents' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                            Hazards
                        </button>
                        <button 
                            onClick={() => { setViewMode('contacts'); setSelectedIncident(null); setSelectedHowTo(null); }}
                            className={`flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'contacts' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i data-lucide="phone" className="w-5 h-5"></i>
                            Contacts
                        </button>
                        <button 
                            onClick={() => { setViewMode('howto'); setSelectedIncident(null); setSelectedHowTo(null); }}
                            className={`flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'howto' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <i data-lucide="book-open" className="w-5 h-5"></i>
                            How To
                        </button>
                    </nav>

                </div>
            );
        }

        // --- SUB-COMPONENT: HOW TO MAIN MODULE ---
        function HowToModule({ onSelectTask }) {
            return (
                <div className="space-y-4">
                    <div className="border-b border-slate-800 pb-2">
                        <h2 className="text-sm font-bold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="book-open" className="w-4 h-4"></i>
                            Field Clinician How-To Guides
                        </h2>
                        <p className="text-[11px] text-slate-400 mt-1">Interactive visual instructions and roadside protocols for field clinicians.</p>
                    </div>

                    <div className="grid grid-cols-1 gap-3">
                        {HOW_TO_TASKS.map((task) => (
                            <button
                                key={task.id}
                                onClick={() => onSelectTask(task)}
                                className="w-full text-left bg-slate-800/90 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-xl p-3.5 space-y-2 transition active:scale-[0.99] group shadow-sm"
                            >
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className={`${task.color} p-2.5 rounded-xl text-white shadow-md flex items-center justify-center shrink-0`}>
                                            <i data-lucide={task.icon} className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-100 group-hover:text-sky-400 transition">{task.title}</h3>
                                            <p className="text-[11px] text-slate-400">{task.category}</p>
                                        </div>
                                    </div>
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">
                                        {task.badge}
                                    </span>
                                </div>
                                <p className="text-xs text-slate-300 line-clamp-2 pl-1">{task.summary}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT: HOW TO DETAIL INFOGRAPHIC MODULE ---
        function HowToDetailModule({ task, onBack }) {
            return (
                <div className="space-y-4">
                    <button 
                        onClick={onBack}
                        className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-white transition bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow-sm"
                    >
                        <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to How-To Guides
                    </button>

                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div className="flex items-center space-x-3">
                            <div className={`${task.color} p-2.5 rounded-xl text-white shadow-md`}>
                                <i data-lucide={task.icon} className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 className="text-base font-bold text-white leading-tight">{task.title}</h2>
                                <span className="text-[10px] text-sky-400 font-semibold tracking-wider uppercase">Infographic Guide & Action Steps</span>
                            </div>
                        </div>
                    </div>

                    {/* CAUTION BOX */}
                    {task.caution && (
                        <div className="bg-red-950/50 border border-red-800 p-3 rounded-xl text-xs space-y-1">
                            <span className="text-red-400 font-bold flex items-center gap-1 text-xs">
                                <i data-lucide="alert-octagon" className="w-4 h-4"></i> CAUTION / WARNING
                            </span>
