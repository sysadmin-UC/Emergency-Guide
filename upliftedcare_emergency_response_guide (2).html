<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpliftedCare - Emergency Preparedness Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .pulse-red {
            animation: pulse-red-anim 1.8s infinite;
        }
        @keyframes pulse-red-anim {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo, createElement: h } = React;

        const FACILITIES = {
            main: {
                name: "Main Building",
                address: "482 Main St. NW, Bourbonnais, IL",
                shelter: "Any of the FOUR Restrooms",
                evacuation: "SW Corner of Parking Lot",
                panicButton: "Front Office Lobby Desk (Under Desk)",
                egressAssembly: "Bourbonnais Police Department",
                generator: "Has Natural Gas Generator (Starts in 5s automatically for emergency circuits)"
            },
            grief: {
                name: "Grief Center",
                address: "3115N, 1000W Rd., Bourbonnais, IL",
                shelter: "Room 115 - The Hideaway (Art Room)",
                evacuation: "Garage (North boundary of parking lot)",
                panicButton: "Front Lobby Desk, Outside Administrative Offices",
                egressAssembly: "Gas Station across the street",
                generator: "No Generator. Battery emergency lights only."
            }
        };

        const INCIDENTS = [
            { id: 'active-shooter', title: 'Active Shooter / Violence', icon: 'shield-alert', category: 'High Risk', color: 'bg-red-600', badge: 'CRITICAL' },
            { id: 'fire', title: 'Fire & Evacuation', icon: 'flame', category: 'Immediate', color: 'bg-orange-600', badge: 'RACE/PASS' },
            { id: 'lockdown', title: 'Security Lock Downs', icon: 'lock', category: 'Security', color: 'bg-amber-600', badge: 'Hard/Soft' },
            { id: 'tornado', title: 'Tornado / Derecho', icon: 'wind', category: 'Severe Weather', color: 'bg-sky-600', badge: 'Shelter' },
            { id: 'bomb-threat', title: 'Bomb Threat Log', icon: 'bomb', category: 'Security Tool', color: 'bg-purple-600', badge: 'Interactive' },
            { id: 'suspicious-package', title: 'Suspicious Package', icon: 'package-x', category: 'Security', color: 'bg-indigo-600', badge: 'Hazmat' },
            { id: 'power-outage', title: 'Power Outage', icon: 'zap-off', category: 'Utility', color: 'bg-yellow-600', badge: 'Generator' },
            { id: 'winter-storm', title: 'Winter Storm / Ice', icon: 'snowflake', category: 'Weather', color: 'bg-blue-600', badge: 'Priority' },
            { id: 'cyber', title: 'Cyber / Data Ransom', icon: 'hard-drive', category: 'IT Hygiene', color: 'bg-teal-600', badge: 'Isolate' },
            { id: 'extreme-temp', title: 'Extreme Temps', icon: 'thermometer', category: 'Weather', color: 'bg-red-700', badge: 'Heat/Cold' },
            { id: 'earthquake', title: 'Earthquake', icon: 'activity', category: 'Geological', color: 'bg-stone-600', badge: 'Drop/Cover' },
            { id: 'supply', title: 'Medical Supply / Drug Shortage', icon: 'pill', category: 'Logistics', color: 'bg-emerald-600', badge: 'Stockpile' }
        ];

        function App() {
            const [activeFacility, setActiveFacility] = useState('main');
            const [selectedIncident, setSelectedIncident] = useState(null);
            const [viewMode, setViewMode] = useState('incidents');
            const [codeWordModal, setCodeWordModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [selectedIncident, viewMode, activeFacility, codeWordModal]);

            const facility = FACILITIES[activeFacility];

            const filteredIncidents = useMemo(() => {
                if (!searchQuery.trim()) return INCIDENTS;
                return INCIDENTS.filter(i => 
                    i.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    i.category.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [searchQuery]);

            return h('div', { className: 'max-w-md mx-auto w-full bg-slate-900 min-h-screen flex flex-col justify-between relative pb-20 shadow-2xl border-x border-slate-800' },
                h('header', { className: 'sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800 p-3 shadow-md' },
                    h('div', { className: 'flex items-center justify-between gap-2' },
                        h('div', { className: 'flex items-center space-x-2' },
                            h('div', { className: 'bg-red-600 text-white p-2 rounded-xl shadow-lg flex items-center justify-center' },
                                h('i', { 'data-lucide': 'shield-alert', className: 'w-6 h-6' })
                            ),
                            h('div', null,
                                h('h1', { className: 'font-bold text-base text-white leading-tight' }, 'UpliftedCare'),
                                h('p', { className: 'text-xs text-red-400 font-semibold tracking-wider uppercase' }, 'Emergency Preparedness')
                            )
                        ),
                        h('a', { 
                            href: 'tel:911', 
                            className: 'pulse-red bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-lg active:scale-95 transition' 
                        },
                            h('i', { 'data-lucide': 'phone-call', className: 'w-4 h-4' }),
                            'CALL 911'
                        )
                    ),
                    h('div', { className: 'mt-3 flex items-center justify-between gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800' },
                        h('div', { className: 'flex text-xs font-medium bg-slate-950 p-0.5 rounded-lg border border-slate-800 flex-1' },
                            h('button', { 
                                onClick: () => setActiveFacility('main'),
                                className: `flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'main' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`
                            }, 'Main Bldg'),
                            h('button', { 
                                onClick: () => setActiveFacility('grief'),
                                className: `flex-1 py-1.5 text-center rounded-md transition ${activeFacility === 'grief' ? 'bg-red-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'}`
                            }, 'Grief Center')
                        ),
                        h('button', { 
                            onClick: () => setCodeWordModal(true),
                            className: 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition'
                        },
                            h('i', { 'data-lucide': 'user-check', className: 'w-3.5 h-3.5' }),
                            'Dr. Armstrong'
                        )
                    )
                ),
                h('main', { className: 'p-4 flex-1' },
                    h('div', { className: 'bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 mb-4 text-xs space-y-1' },
                        h('div', { className: 'flex items-center justify-between text-slate-300 font-medium' },
                            h('span', { className: 'flex items-center gap-1 text-red-400 font-bold' },
                                h('i', { 'data-lucide': 'map-pin', className: 'w-3.5 h-3.5' }),
                                ' ', facility.name
                            ),
                            h('span', { className: 'text-slate-400 text-[10px] truncate max-w-[150px]' }, facility.address)
                        ),
                        h('div', { className: 'grid grid-cols-2 gap-2 text-[11px] pt-1 border-t border-slate-700/50' },
                            h('div', null, h('span', { className: 'text-slate-400' }, 'Shelter: '), h('span', { className: 'text-slate-200 font-semibold' }, facility.shelter)),
                            h('div', null, h('span', { className: 'text-slate-400' }, 'Evac Zone: '), h('span', { className: 'text-slate-200 font-semibold' }, facility.evacuation))
                        )
                    ),
                    viewMode === 'incidents' && !selectedIncident && h('div', null,
                        h('div', { className: 'relative mb-4' },
                            h('i', { 'data-lucide': 'search', className: 'w-4 h-4 absolute left-3 top-3 text-slate-400' }),
                            h('input', { 
                                type: 'text',
                                placeholder: 'Search emergency incident or protocol...',
                                value: searchQuery,
                                onChange: (e) => setSearchQuery(e.target.value),
                                className: 'w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition'
                            })
                        ),
                        h('div', { className: 'flex items-center justify-between mb-2' },
                            h('h2', { className: 'text-xs font-bold uppercase tracking-wider text-slate-400' }, 'Emergency Quick Guides'),
                            h('span', { className: 'text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full' }, `${filteredIncidents.length} Hazards`)
                        ),
                        h('div', { className: 'grid grid-cols-1 gap-2.5' },
                            filteredIncidents.map(incident => 
                                h('button', {
                                    key: incident.id,
                                    onClick: () => setSelectedIncident(incident.id),
                                    className: 'w-full text-left bg-slate-800/90 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-xl p-3 flex items-center justify-between transition active:scale-[0.99] group shadow-sm'
                                },
                                    h('div', { className: 'flex items-center space-x-3' },
                                        h('div', { className: `${incident.color} p-2.5 rounded-xl text-white shadow-md flex items-center justify-center shrink-0` },
                                            h('i', { 'data-lucide': incident.icon || 'alert-circle', className: 'w-5 h-5' })
                                        ),
                                        h('div', null,
                                            h('h3', { className: 'text-sm font-bold text-slate-100 group-hover:text-red-400 transition' }, incident.title),
                                            h('p', { className: 'text-[11px] text-slate-400' }, incident.category)
                                        )
                                    ),
                                    h('div', { className: 'flex items-center gap-2' },
                                        h('span', { className: 'text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300' }, incident.badge),
                                        h('i', { 'data-lucide': 'chevron-right', className: 'w-4 h-4 text-slate-500 group-hover:text-slate-300' })
                                    )
                                )
                            )
                        )
                    ),
                    selectedIncident && h(IncidentDetailModule, { incidentId: selectedIncident, facility: facility, onBack: () => setSelectedIncident(null) }),
                    viewMode === 'contacts' && h(ContactsModule, { facility: facility })
                ),
                codeWordModal && h('div', { className: 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4' },
                    h('div', { className: 'bg-slate-900 border border-amber-500/50 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl relative' },
                        h('button', { onClick: () => setCodeWordModal(false), className: 'absolute top-3 right-3 text-slate-400 hover:text-white p-1' },
                            h('i', { 'data-lucide': 'x', className: 'w-5 h-5' })
                        ),
                        h('div', { className: 'flex items-center space-x-3 border-b border-slate-800 pb-3' },
                            h('div', { className: 'bg-amber-500/20 text-amber-400 p-2.5 rounded-xl border border-amber-500/30' },
                                h('i', { 'data-lucide': 'shield-alert', className: 'w-6 h-6' })
                            ),
                            h('div', null,
                                h('h3', { className: 'font-bold text-white text-base' }, 'Dr. Armstrong Protocol'),
                                h('p', { className: 'text-xs text-amber-400 font-medium' }, 'Discreet Threat Distress Code')
                            )
                        ),
                        h('div', { className: 'space-y-3 text-xs text-slate-300 leading-relaxed' },
                            h('p', { className: 'bg-amber-950/40 border border-amber-900/50 text-amber-200 p-2.5 rounded-lg' },
                                h('strong', null, 'When to use: '), 'Use when trapped in a hostile situation and unable to request police directly.'
                            ),
                            h('div', { className: 'space-y-1' },
                                h('span', { className: 'font-bold text-slate-200' }, 'Verbal Script Example:'),
                                h('div', { className: 'bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-[11px] text-slate-200 leading-normal select-all' },
                                    '"Hello. This is [Your Name]. I need you to page ',
                                    h('span', { className: 'text-amber-400 font-bold underline' }, 'Dr. Armstrong'),
                                    ' immediately. We have had some complications here. Please tell him/her to come to ',
                                    h('span', { className: 'text-red-400 font-bold' }, '[Your Current Address]'),
                                    ' as soon as possible. Tell him/her to come right on into the house."'
                                )
                            )
                        ),
                        h('div', { className: 'pt-2 flex gap-2' },
                            h('a', { href: 'tel:911', className: 'flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1.5 shadow' },
                                h('i', { 'data-lucide': 'phone', className: 'w-4 h-4' }), ' Call 911 Directly'
                            ),
                            h('button', { onClick: () => setCodeWordModal(false), className: 'px-4 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-semibold' }, 'Close')
                        )
                    )
                ),
                h('nav', { className: 'fixed bottom-0 max-w-md w-full bg-slate-950/95 backdrop-blur border-t border-slate-800 px-3 py-2 flex justify-around items-center z-40' },
                    h('button', { 
                        onClick: () => { setViewMode('incidents'); setSelectedIncident(null); },
                        className: `flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'incidents' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`
                    },
                        h('i', { 'data-lucide': 'alert-triangle', className: 'w-5 h-5' }),
                        'Hazards'
                    ),
                    h('button', { 
                        onClick: () => { setViewMode('contacts'); setSelectedIncident(null); },
                        className: `flex flex-col items-center gap-1 text-[10px] font-medium transition ${viewMode === 'contacts' ? 'text-red-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`
                    },
                        h('i', { 'data-lucide': 'phone', className: 'w-5 h-5' }),
                        'Contacts'
                    )
                )
            );
        }

        function IncidentDetailModule({ incidentId, facility, onBack }) {
            return h('div', { className: 'space-y-4' },
                h('button', { 
                    onClick: onBack,
                    className: 'flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-white transition bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700'
                },
                    h('i', { 'data-lucide': 'arrow-left', className: 'w-4 h-4' }), ' Back to Incident List'
                ),
                h('div', { className: 'flex items-center space-x-3 border-b border-slate-800 pb-3' },
                    h('div', { className: 'bg-red-600 p-2.5 rounded-xl text-white shadow-md' },
                        h('i', { 'data-lucide': 'shield-alert', className: 'w-6 h-6' })
                    ),
                    h('div', null,
                        h('h2', { className: 'text-base font-bold text-white leading-tight' }, INCIDENTS.find(i => i.id === incidentId)?.title),
                        h('span', { className: 'text-[10px] text-red-400 font-semibold tracking-wider uppercase' }, 'Action Checklist & Response Guide')
                    )
                ),
                incidentId === 'active-shooter' ? h('div', { className: 'space-y-4 text-xs' },
                    h('div', { className: 'bg-red-950/50 border border-red-800 p-3 rounded-xl space-y-2' },
                        h('div', { className: 'flex items-center gap-2 text-red-400 font-bold text-sm' },
                            h('i', { 'data-lucide': 'alert-octagon', className: 'w-5 h-5' }), ' Panic Alarm Locations'
                        ),
                        h('p', { className: 'text-slate-300' }, h('strong', null, `Current Facility (${facility.name}): `), facility.panicButton)
                    ),
                    h('div', { className: 'bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700' },
                        h('div', { className: 'text-xs font-bold text-emerald-400' }, '1. EVACUATE (RUN)'),
                        h('p', { className: 'text-slate-300' }, 'Have an escape route in mind. Evacuate regardless of whether others follow. Call 911 when safe.')
                    ),
                    h('div', { className: 'bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700' },
                        h('div', { className: 'text-xs font-bold text-amber-400' }, '2. HIDE OUT (HIDE)'),
                        h('p', { className: 'text-slate-300' }, 'Hide in a locked room. Blockade door. SILENCE CELL PHONES completely (turn off vibration).')
                    ),
                    h('div', { className: 'bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-700' },
                        h('div', { className: 'text-xs font-bold text-red-400' }, '3. TAKE ACTION (FIGHT)'),
                        h('p', { className: 'text-slate-300' }, 'As absolute last resort, act as aggressively as possible to incapacitate the shooter.')
                    )
                ) : h('div', { className: 'bg-slate-800 p-4 rounded-xl text-xs text-slate-300' },
                    'Standard emergency protocols apply. Follow supervisor and local emergency responders.'
                )
            );
        }

        function ContactsModule({ facility }) {
            return h('div', { className: 'space-y-4' },
                h('div', { className: 'border-b border-slate-800 pb-3' },
                    h('h2', { className: 'text-base font-bold text-white leading-tight' }, 'Emergency Contacts Directory'),
                    h('p', { className: 'text-xs text-slate-400' }, 'Integrated agency and community response partners.')
                ),
                h('div', { className: 'space-y-2' },
                    h('a', { 
                        href: 'tel:911', 
                        className: 'w-full bg-red-600/90 hover:bg-red-600 text-white p-3 rounded-xl font-bold text-sm flex items-center justify-between shadow border border-red-500' 
                    },
                        h('span', { className: 'flex items-center gap-2' },
                            h('i', { 'data-lucide': 'phone-call', className: 'w-5 h-5' }), ' Emergency First Responders'
                        ),
                        h('span', { className: 'font-mono text-base' }, '911')
                    ),
                    h('a', { 
                        href: 'tel:8158027172', 
                        className: 'w-full bg-slate-800 hover:bg-slate-700/80 text-slate-100 p-3 rounded-xl text-xs flex items-center justify-between border border-slate-700' 
                    },
                        h('div', null,
                            h('strong', { className: 'block text-slate-200' }, "Kankakee County Sheriff's Office"),
                            h('span', { className: 'text-[10px] text-slate-400' }, '3000 S Justice Way, Kankakee, IL')
                        ),
                        h('span', { className: 'font-mono text-xs font-bold text-sky-400' }, '(815) 802-7172')
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
